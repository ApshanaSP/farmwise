<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Chennai District Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Single committed blue & white theme */
:root{
  color-scheme:light;
  --bg:#EEF3FC; --surface:#FFFFFF; --surface-2:#F4F7FE; --line:#DFE8F7; --line-2:#EBF1FB;
  --text:#0A1A3C; --text-2:#465B80; --text-3:#8394B2;
  --accent:#1560E8; --accent-2:#0B3FA8; --accent-3:#4D8DFF; --accent-soft:#E7EFFE; --accent-ink:#0B3FA8; --on-accent:#FFFFFF;
  --side-a:#082A70; --side-b:#0C3D9C; --side-text:#BFD1F5;
  --sev:#E0343B; --sev-soft:#FDE9EA; --high:#EE8414; --high-soft:#FEF0DF; --med:#C99A06; --med-soft:#FBF4D8; --low:#16A06A; --low-soft:#E0F6EC;
  --info:#1560E8; --info-soft:#E7EFFE; --violet:#6A55D8; --violet-soft:#EEEBFC;
  --map-out:#F3F6FC; --sea-a:#D5E7FC; --sea-b:#B3D2F8; --map-edge:#FFFFFF; --map-sel:#2F6FEA;
  --m0:#EDF4FF; --m1:#D6E6FE; --m2:#B7D2FC; --m3:#8DB6F7; --m4:#5F95EF;
  --b1:#1560E8; --b2:#3B7CF0; --b3:#6699F5; --b4:#8FB5F8; --b5:#B7CFFA;
  --shadow:0 1px 2px rgba(11,40,100,.05),0 8px 24px -8px rgba(21,96,232,.14);
  --shadow-lg:0 24px 64px rgba(8,30,80,.26);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html.fit body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
select,input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num,.kpi-n,.big{font-family:Manrope,"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Manrope,"IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#C9D7F0;border-radius:6px} ::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100%}
html.fit .app{min-height:0}
.side{background:radial-gradient(120% 60% at 0% 0%,#1A55C8 0%,transparent 60%),linear-gradient(185deg,var(--side-a) 0%,var(--side-b) 100%);color:var(--side-text);display:flex;flex-direction:column;gap:16px;padding:16px 12px;overflow:hidden auto;z-index:50;position:relative}
.side:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.side>*{position:relative;z-index:1}
.brand{display:flex;gap:10px;align-items:center;color:#fff;padding:2px 4px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand-mark .ic{width:22px;height:22px;color:var(--accent)}
.brand b{display:block;font:800 14.5px/1.2 Manrope,sans-serif;letter-spacing:.01em}
.brand small{font-size:11px;color:var(--side-text)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8FA9DB;padding:8px 10px 4px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--side-text);font-weight:500;width:100%;font-size:13px;transition:background .15s,color .15s}
.nav-i:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-i.on{background:#fff;color:var(--accent-2);font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.nav-i .ic{width:16px;height:16px}
.badge-s{margin-left:auto;font:600 10.5px/1 "IBM Plex Mono",monospace;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff}
.nav-i.on .badge-s{background:var(--accent-soft);color:var(--accent-2)}
.feeds{margin-top:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.feeds b{color:#fff;font:700 12px Manrope,sans-serif;display:flex;justify-content:space-between}
.feeds span{display:flex;align-items:center;gap:7px}
.feeds i{width:7px;height:7px;border-radius:50%;background:#3FE39A;box-shadow:0 0 0 3px rgba(63,227,154,.18)}
.feeds em{margin-left:auto;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#9FB7E6}
.side-tag{font-size:11px;color:#8FA9DB;text-align:center;letter-spacing:.04em}
.main{min-width:0;display:flex;flex-direction:column;gap:10px;padding:0 16px 12px}
html.fit .main{height:100%;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:10px;height:58px;margin:0 -16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hamb{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);place-items:center}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px 0 38px;outline:none;font-size:13px}
.search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search>.ic{position:absolute;left:12px;top:11px;color:var(--accent)}
.search kbd{position:absolute;right:10px;top:9px;font:500 11px "IBM Plex Mono",monospace;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.sres{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:380px;overflow:auto;z-index:70}
.sres button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;border-radius:8px}
.sres button:hover,.sres button.hl{background:var(--accent-soft)}
.sres small{color:var(--text-3);margin-left:auto;font-size:11.5px;white-space:nowrap}
.sres .sh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:6px 10px 2px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;position:relative}
.seg button{padding:6px 13px;border-radius:8px;font-weight:600;color:var(--text-2);font-size:12.5px;transition:color .2s,background .2s}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 12px rgba(21,96,232,.35)}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;margin-left:auto}
.clock b{font:700 14px "IBM Plex Mono",monospace;color:var(--accent-2)}
.clock small{font-size:11px;color:var(--text-3)}
.tbtn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;position:relative;color:var(--text-2)}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.dot-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--sev);color:#fff;font:600 10.5px/18px "IBM Plex Mono",monospace;text-align:center;padding:0 5px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:9px;padding:3px 6px 3px 3px;border-radius:12px}
.me:hover{background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--accent-2),var(--accent-3));color:#fff;display:grid;place-items:center;font:700 12.5px Manrope,sans-serif}
.me b{display:block;font-size:13px}
.me small{color:var(--text-3);font-size:11.5px}
.rel{position:relative}
.pop{position:absolute;right:0;top:46px;width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;z-index:60}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px;font-weight:600}
.pop-i{display:flex;gap:10px;padding:8px;border-radius:10px;width:100%;align-items:flex-start}
.pop-i:hover{background:var(--accent-soft)}
.pop-i small{display:block;color:var(--text-3);font-size:12px}

#view{display:flex;flex-direction:column;gap:10px;min-height:0}
html.fit #view{flex:1}

/* ---------- hero ---------- */
.hero{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:16px;color:#fff;
  background:radial-gradient(90% 180% at 100% 0%,rgba(122,178,255,.55) 0%,transparent 55%),linear-gradient(118deg,#0A3494 0%,#1257D6 55%,#2C78FA 100%);box-shadow:0 12px 30px -12px rgba(18,87,214,.6)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%,#000)}
.hero>*{position:relative}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#BCD3FF;display:flex;gap:6px;flex-wrap:wrap}
.eyebrow button{color:#BCD3FF;letter-spacing:inherit;text-transform:inherit}
.eyebrow button:hover{color:#fff}
.hero h1{font-size:23px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.hero h1 .lt{font-weight:500;color:#D4E3FF}
.hero-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.hero-ic .ic{width:22px;height:22px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 11px;border-radius:10px;background:#fff;color:var(--accent-2);font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.fchip .x{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent-soft)}
.ticker{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:11px;padding:6px 10px;backdrop-filter:blur(6px)}
.tk-l{font:700 10.5px "IBM Plex Mono",monospace;letter-spacing:.1em;background:#fff;color:var(--sev);padding:3px 7px;border-radius:6px;display:flex;align-items:center;gap:5px;flex:none}
.tk-l i{width:6px;height:6px;border-radius:50%;background:var(--sev);animation:blink 1.2s infinite}
.tk-w{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk-t{display:inline-flex;gap:28px;white-space:nowrap;animation:marquee linear infinite}
.tk-w:hover .tk-t{animation-play-state:paused}
.tk-t button{color:#fff;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.tk-t button:hover{text-decoration:underline}
.tk-t s{text-decoration:none;font:600 11px "IBM Plex Mono",monospace;color:#BCD3FF}
.tk-t u{text-decoration:none;width:7px;height:7px;border-radius:50%}
.hero-meta{text-align:right;font-size:11.5px;color:#C7DAFF;line-height:1.45;flex:none}
.hero-meta b{color:#fff;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:11px;letter-spacing:.1em}
.live i{width:8px;height:8px;border-radius:50%;background:#3FE39A;animation:pulse 1.8s infinite}
.hero-head{display:flex;align-items:center;gap:12px;flex:none;font-size:12px;color:#D4E3FF;border-left:1px solid rgba(255,255,255,.2);padding-left:16px}
.hero-head b{display:block;color:#fff;font:700 14px Manrope,sans-serif}
.hero-head .avatar{background:#fff;color:var(--accent-2);width:40px;height:40px;border-radius:12px}
.btn-w{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:#fff;color:var(--accent-2);font-weight:700;font-size:12.5px;white-space:nowrap}
.btn-w:hover{background:#EAF1FF}

/* ---------- KPIs ---------- */
.kpis{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 12px 11px 14px;transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-3));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.kpi:hover{transform:translateY(-2px);border-color:#BFD3FA;box-shadow:0 14px 30px -12px rgba(21,96,232,.35)}
.kpi:hover:after{transform:scaleX(1)}
.kpi-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi-ic .ic{width:21px;height:21px}
.t-sev{background:var(--sev-soft);color:var(--sev)} .t-high{background:var(--high-soft);color:var(--high)} .t-info{background:var(--info-soft);color:var(--info)} .t-low{background:var(--low-soft);color:var(--low)} .t-violet{background:var(--violet-soft);color:var(--violet)} .t-med{background:var(--med-soft);color:var(--med)}
.t-blue{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff}
.kpi-b{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.kpi-l{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-l b{font-weight:600;color:var(--text)}
.kpi-n{font-size:27px;font-weight:800;line-height:1.1;letter-spacing:-.02em;color:var(--text)}
.kpi-n small{font-size:14px;font-weight:700;color:var(--text-2);margin-left:2px}
.c-sev{color:var(--sev)}
.kpi-d{font-weight:600;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.kpi-d .ic{width:12px;height:12px;display:inline;vertical-align:-2px}
.kpi-d em{font-style:normal;padding:1px 5px;border-radius:5px;margin-right:4px}
.kpi-d.good em{color:var(--low);background:var(--low-soft)} .kpi-d.bad em{color:var(--sev);background:var(--sev-soft)} .kpi-d em{background:var(--surface-2)}
.kpi .spk{width:64px;height:34px;flex:none}
.kpi-r{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-width:0}
.kpi-c{display:flex;flex-direction:column;min-width:0}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ch{flex:none;display:flex;align-items:center;gap:8px;padding:10px 13px 8px;min-width:0}
.ch h3{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ch h3 span{font-weight:500;color:var(--text-3);font-size:12px}
.ch>.ic{color:var(--accent);width:18px;height:18px}
.ch .more{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap;flex:none}
.ch .more .ic{width:14px;height:14px}
.ch .cnt-b{font:600 11px "IBM Plex Mono",monospace;background:var(--accent-soft);color:var(--accent-2);padding:2px 7px;border-radius:6px}
.cb{flex:1;min-height:0;overflow:auto;padding:0 13px 11px}
.sel{height:30px;border-radius:8px;border:1px solid var(--line);background-color:#fff;padding:0 26px 0 9px;font-size:12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.sel:hover{border-color:var(--accent)}
.ov-grid{display:grid;gap:10px;grid-template-columns:minmax(0,1.32fr) minmax(0,.95fr) minmax(0,1.15fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"map snap brief tasks" "map recent recent tl"}
html.fit .ov-grid{flex:1;min-height:0}
.a-map{grid-area:map}.a-snap{grid-area:snap}.a-brief{grid-area:brief}.a-tasks{grid-area:tasks}.a-recent{grid-area:recent}.a-tl{grid-area:tl}
.bottom{flex:none;display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr));height:172px}
.dp-grid{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1.18fr) minmax(0,1fr);grid-template-areas:"map tbl tbl q" "tl src act tr"}
html.fit .dp-grid{flex:1;min-height:0}
.g-map{grid-area:map}.g-tbl{grid-area:tbl}.g-q{grid-area:q}.g-tl{grid-area:tl}.g-src{grid-area:src}.g-act{grid-area:act}.g-tr{grid-area:tr}

/* ---------- map ---------- */
.map-cb{padding:0 10px 10px;display:flex;flex-direction:column;overflow:hidden}
.map-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:1;min-height:0;background:var(--map-out)}
.map-svg{display:block;width:100%;height:100%}
.rg{stroke:var(--map-edge);stroke-width:2;cursor:pointer;transition:fill .3s,opacity .3s}
.rg:hover{fill:#A9C8FA}
.lv0{fill:var(--m0)}.lv1{fill:var(--m1)}.lv2{fill:var(--m2)}.lv3{fill:var(--m3)}.lv4{fill:var(--m4)}
.rg.sel{fill:var(--map-sel);stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 6px 10px rgba(21,96,232,.45))}
.rg.dim{opacity:.55}
.rl{font:700 12.5px Manrope,sans-serif;fill:#10306E;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px}
.rl.selr{font-size:16px;font-weight:800;fill:#fff;stroke:rgba(10,52,148,.55)}
.sea-l{font:italic 600 15px Manrope,sans-serif;fill:#3C73C8;letter-spacing:.04em}
.pin{cursor:pointer}
.pin path{transform-box:fill-box;transform-origin:50% 100%;transition:transform .15s}
.pin:hover path{transform:scale(1.3)}
.pin.faded{opacity:.4}
.pulse{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite;pointer-events:none}
.map-leg{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;font-size:11.5px;box-shadow:var(--shadow)}
.map-leg button,.map-leg span{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:6px}
.map-leg button:hover{background:var(--accent-soft)}
.map-leg button.off{opacity:.4;text-decoration:line-through}
.map-leg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-scale{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:10.5px;color:var(--text-3);display:flex;flex-direction:column;gap:4px}
.map-scale div{display:flex;gap:2px}
.map-scale div i{width:14px;height:8px;border-radius:2px;display:block}
.map-tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--accent)}
.tip{position:fixed;z-index:96;pointer-events:none;background:#0A1A3C;color:#fff;padding:8px 10px;border-radius:9px;font-size:12px;box-shadow:var(--shadow-lg);max-width:240px}
.tip b{display:block;font-size:13px;margin-bottom:2px}

/* ---------- lists ---------- */
.snap-row{display:flex;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--line-2);width:100%;border-radius:8px;min-height:34px}
.snap-row:hover{background:var(--accent-soft)}
.snap-row:last-child{border-bottom:0}
.snap-row .si{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}

function trendCard(d,iv){
 const types=d.types.map(t=>t[0]);const n=12,W=280,Hh=128;const wk=[];
 for(let w=n-1;w>=0;w--){const end=NOW-w*168*H;wk.push({t:end-168*H,v:INC.filter(i=>i.dept===d.id&&i.t>end-168*H&&i.t<=end&&(S.trend==='all'||i.type===S.trend)&&(!S.area||i.region===S.area)).length})}
 const mx=Math.max(4,...wk.map(x=>x.v));const bw=W/n;
 let s=`<svg viewBox="0 0 ${W+26} ${Hh+18}" class="mini" role="img" aria-label="Weekly incidents">`;
 [0,.5,1].forEach(f=>{const y=12+(Hh-12)*(1-f);s+=`<line class="grid" x1="24" x2="${W+26}" y1="${y}" y2="${y}"/><text class="tick" x="18" y="${y+3}" text-anchor="end">${Math.round(mx*f)}</text>`});
 wk.forEach((x,ix)=>{const h=x.v/mx*(Hh-12);const X=26+ix*bw+bw*.18;s+=`<rect class="${ix===n-1?'bar-last':'bar'}" x="${X}" y="${Hh-h}" width="${bw*.64}" height="${Math.max(h,1)}" rx="3" style="animation-delay:${(.15+ix*.03).toFixed(2)}s"><title>Week of ${fmtDate(x.t)}: ${x.v}</title></rect>`;if(ix%2===1||ix===n-1)s+=`<text class="vl" x="${X+bw*.32}" y="${Hh-h-4}" text-anchor="middle">${x.v}</text>`;if(ix%3===0||ix===n-1)s+=`<text class="tick" x="${X+bw*.32}" y="${Hh+13}" text-anchor="middle">${fmtDate(x.t)}</text>`});
 s+='</svg>';
 return`<article class="card g-tr" ${iv()}><div class="ch">${I('chart')}<h3>12-Week Trend</h3><select class="sel" data-change="trend" aria-label="Incident type" style="margin-left:auto;max-width:150px"><option value="all">All ${d.short} incidents</option>${types.map(t=>`<option ${S.trend===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="cb">${s}</div></article>`}

 INC.filter(i=>(i.title+' '+i.type+' '+i.loc+' '+i.id+' '+i.sources.map(s=>s.name).join(' ')).toLowerCase().includes(q)).sort((a,b)=>(open(b)-open(a))||b.t-a.t).slice(0,7).forEach(i=>out.push({g:'Incidents',ic:DEP[i.dept].icon,l:fullTitle(i),s:`${REG[i.region].name} · ${rel(i.t)}`,a:'inc',v:i.id}));

function answer(q){const t=q.toLowerCase();const cur=scope();
 if(t.includes('area')||t.includes('attention')||t.includes('where')){const sc={};cur.filter(open).forEach(i=>sc[i.region]=(sc[i.region]||0)+(4-SEVR[i.severity])*2+i.complaints);const [r]=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0]||[];if(!r)return'No open incidents in this period.';const ol=cur.filter(i=>i.region===r&&open(i));const top=[...ol].sort(bySev)[0];return`<b>${REG[r].name}</b> has the highest weighted load (${ol.length} open incidents, ${sum(ol,i=>i.complaints)} complaints). Top item: ${esc(fullTitle(top))} (${top.severity}). <button data-a="area" data-v="${r}">Filter dashboard to ${REG[r].name} ›</button>`}
 if(t.includes('verif')||t.includes('waiting')||t.includes('task')){const q=queue();return q.length?`${q.length} incidents are waiting for verification${S.area?' in '+REG[S.area].name:''}. Most urgent: ${q.slice(0,3).map(i=>`<button data-a="inc" data-v="${i.id}">${esc(i.type)} – ${REG[i.region].name}</button>`).join(', ')}.`:'Nothing is waiting for verification.'}
 if(t.includes('slow')||t.includes('department')||t.includes('dept')){const ag={};INC.filter(open).forEach(i=>{(ag[i.dept]=ag[i.dept]||[]).push((NOW-i.t)/H)});const [d,a]=Object.entries(ag).map(([d,a])=>[d,a.reduce((x,y)=>x+y,0)/a.length]).sort((x,y)=>y[1]-x[1])[0];return`<b>${DEP[d].name}</b> has the oldest open backlog, averaging ${Math.round(a)} hours per open incident (${ag[d].length} open). <button data-a="nav" data-v="${d}">Open ${DEP[d].name} ›</button>`}
 const k=kpis(cur);const topD=Object.entries(cur.reduce((m,i)=>(m[i.dept]=(m[i.dept]||0)+1,m),{})).sort((a,b)=>b[1]-a[1])[0];
 return`${P().label}, ${areaName().toLowerCase()}: ${cur.length} incidents reported, ${k.severe} severe, ${k.ongoing} still open with ${k.complaints} linked complaints, and ${k.resolved} resolved. Average response time is ${k.resp.toFixed(1)} hours.${topD?` ${DEP[topD[0]].name} carries the most load (${topD[1]} incidents).`:''}`}

 Z=zoomOK?Math.min(w/1600,h/860):1;document.body.style.zoom=Z===1?'':Z;app.style.width=(w/Z)+'px';app.style.height=(h/Z)+'px';
 // Chrome >=128 reports getBoundingClientRect in zoomed (visual) px; older engines report unzoomed. Detect once.

 case'nav':closeAll();document.body.classList.remove('nav-open');if(v!==S.view){S.page=0;S.trend='all';S.sel=null;S.qsel.clear();S.anim=true}location.hash=v==='overview'?'overview':'dept-'+v;if(S.view===v)renderAll();break;
 case'navinc':{const i=INC.find(x=>x.id===v);S.drawer=null;renderOverlay();if(S.view!==i.dept){S.page=0;S.trend='all';S.anim=true;S.selNext=v;location.hash='dept-'+i.dept}else{S.sel=v;renderAll()}break}
 case'side':document.body.classList.toggle('nav-open');break;
 case'area':S.area=v||null;S.hist=null;S.page=0;S.anim=true;closeAll();renderAll();if(S.ask)renderAsk();if(v)toast(`Showing ${REG[v].name}. All panels filtered.`);break;
 case'period':S.period=v;S.page=0;S.anim=true;refresh();break;
 case'layer':S.layers[v]=!S.layers[v];renderView();break;
 case'inc':openDrawer(v);break;
 case'dsel':S.sel=v;renderView();break;
 case'qtab':S.qtab=v;renderView();break;
 case'close':closeAll();break;
 case'verify':e.stopPropagation();verify(v);refresh();break;
 case'bulkverify':{const n=S.qsel.size;[...S.qsel].forEach(id=>verify(id,true));toast(`${n} incidents verified and assigned.`);refresh();break}
 case'qsel':S.qsel.has(v)?S.qsel.delete(v):S.qsel.add(v);renderView();break;
 case'escalate':{const i=INC.find(x=>x.id===v);const nxt=(DEP[i.dept].route.split('→')[1]||'next level').trim();i.escalated=true;addStep(i,'Escalated',`Escalated to ${nxt}`,'escalate');if(i.severity!=='Severe')i.severity=SEV[SEVR[i.severity]-1];toast(`Escalated ${esc(i.type)} to ${nxt}.`);refresh();break}
 case'resolve':{const i=INC.find(x=>x.id===v);i.status='Resolved';i.resolvedAt=Date.now();i.verified=true;i.actions.forEach(x=>x.st='Done');addStep(i,'Resolved','Closed from collector dashboard','resolved');toast(`Resolved: ${esc(i.type)}, ${REG[i.region].name}.`);refresh();break}
 case'cycle':{const[id,ix]=v.split(':');const i=INC.find(x=>x.id===id);const order=['Not Started','Pending','In Progress','Done'];const ac=i.actions[+ix];ac.st=order[(order.indexOf(ac.st)+1)%4];if(i.actions.every(x=>x.st==='Done')&&open(i))toast('All actions done. Use “Mark resolved” to close the incident.');refresh();break}
 case'addaction':{const box=$('#addAct');if(!box)break;box.innerHTML=`<form id="actF" data-v="${v}" style="display:flex;gap:6px;margin-bottom:8px"><input id="actI" placeholder="e.g. Deploy suction pump" style="flex:1;min-width:0;height:30px;border-radius:8px;border:1px solid var(--line);padding:0 9px;font-size:12.5px"><button class="btn sm">Add</button></form>`;$('#actI').focus();break}
 case'page':S.page=Math.max(0,S.page+ +v);renderView();break;
 case'kpi':{const map={severe:[{sev:'Severe'},'Severe events'],complaints:[{status:'open',sort:'c'},'Open complaints'],ongoing:[{status:'open'},'Ongoing incidents'],resolved:[{status:'Resolved'},'Resolved incidents'],unverified:[{status:'unverified',scope:'all',sort:'sev',dir:1},'Awaiting verification'],critical:[{status:'critical',scope:'all'},'Critical items awaiting action'],all:[{},'All incidents'],open:[{status:'open'},'Open incidents'],verified:[{status:'verified'},'Officer-verified, still open'],resp:[{status:'Assigned'},'Recently assigned incidents']};const[p,t]=map[v]||map.all;openList(p,`${t} · ${areaName()}`);break}
 case'sort':S.list.dir=S.list.sort===v?-S.list.dir:-1;S.list.sort=v;refreshModal();break;
 case'lpage':S.list.page=Math.max(0,S.list.page+ +v);refreshModal();break;
 case'locq':openList({q:v,scope:'period'},`Incidents at ${v}`);break;
 case'regions':openModal('Regions by open complaints',()=>{const rows=REGIONS.map(r=>{const l=scope({area:r.id});return{r,o:l.filter(open).length,c:sum(l.filter(open),i=>i.complaints),s:l.filter(i=>i.severity==='Severe').length}}).sort((a,b)=>b.c-a.c);const mx=Math.max(1,...rows.map(x=>x.c));return`<div class="tbl-wrap"><table><thead><tr><th>Region</th><th>Open incidents</th><th style="width:40%">Open complaints</th><th>Severe</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr data-a="area" data-v="${x.r.id}"><td class="ev">${x.r.name}</td><td class="num">${x.o}</td><td><span style="display:flex;gap:8px;align-items:center"><span class="hb-t" style="flex:1"><span class="hb-b" style="width:${x.c/mx*100}%;background:linear-gradient(90deg,var(--b1),var(--b3))"></span></span><b class="num">${x.c}</b></span></td><td class="num" style="color:var(--sev)">${x.s}</td><td><span class="lnk">Filter ›</span></td></tr>`).join('')}</tbody></table></div>`});break;
 case'depts':openModal('Departments',()=>`<div class="tbl-wrap"><table><thead><tr><th>Department</th><th>Open incidents</th><th>Awaiting verification</th><th>Severe</th><th>Head</th></tr></thead><tbody>${DEPTS.map(d=>{const l=scope({dept:d.id});return`<tr data-a="nav" data-v="${d.id}"><td class="ev">${d.name}</td><td class="num">${l.filter(open).length}</td><td class="num">${queue(d.id).length}</td><td class="num" style="color:var(--sev)">${l.filter(i=>i.severity==='Severe').length}</td><td class="dim">${d.head}</td></tr>`}).join('')}</tbody></table></div>`);break;
 case'contact':{const d=DEP[v];openModal(`Contact ${d.head}`,()=>`<p style="margin-top:0"><b>${d.head}</b>, ${d.unit}, Chennai District<br><span style="color:var(--text-3)">Escalation route: ${d.route}</span></p><p style="color:var(--text-2)">In the live system this would place a call through the district control room. In this demo you can log a follow-up instead.</p><button class="btn" data-a="logcall" data-v="${d.id}">${I('phone')}Log follow-up request</button>`);break}
 case'logcall':closeAll();toast(`Follow-up request logged for ${DEP[v].head}.`);break;
 case'menu':{e.stopPropagation();const i=INC.find(x=>x.id===v);showMenu(el,`<button data-a="inc" data-v="${v}">${I('doc')}View details</button><button data-a="escalate" data-v="${v}">${I('esc')}Escalate</button><button data-a="navinc" data-v="${v}">${I(DEP[i.dept].icon)}Open in ${DEP[i.dept].short}</button><button data-a="area" data-v="${i.region}">${I('pin')}Filter to ${REG[i.region].name}</button><button data-a="dismiss" data-v="${v}">${I('x')}Dismiss as duplicate</button>`);break}
 case'dismiss':{const i=INC.find(x=>x.id===v);i.verified=true;i.status='Resolved';i.resolvedAt=Date.now();addStep(i,'Closed as duplicate','Merged with an existing incident','resolved');toast(`Dismissed ${esc(i.type)} as duplicate.`);refresh();break}
 case'bell':togglePop('bell',el);break;
 case'bellread':S.bellRead=true;renderTop();break;
 case'profile':togglePop('profile',el);break;
 case'reset':S.area=null;S.sel=null;S.qsel.clear();S.bellRead=false;S.chat=[];S.anim=true;generate();closeAll();renderAll();toast('Demo data regenerated.');break;
 case'export':{const rows=scope();const csv=['id,event,area,location,department,severity,status,complaints,reported',...rows.map(i=>[i.id,i.type,REG[i.region].name,i.loc,DEP[i.dept].name,i.severity,i.status,i.complaints,new Date(i.t).toISOString()].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');
  openModal(`Export · ${rows.length} incidents`,()=>`<p style="margin-top:0;color:var(--text-2)">${P().label}, ${areaName()}. Copy the CSV below into a spreadsheet.</p><textarea id="csv" readonly style="width:100%;height:280px;font:12px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)">${esc(csv)}</textarea><div style="margin-top:10px"><button class="btn" data-a="copy">${I('copy')}Copy CSV</button></div>`);break}
 case'copy':{const ta=$('#csv');const fb=()=>{ta.focus();ta.select();toast('Press Ctrl+C to copy the selected CSV.')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('CSV copied to clipboard.')).catch(fb)}catch(_){fb()}break}
 case'ask':S.ask=!S.ask;renderAsk();if(S.ask)setTimeout(()=>$('#askI')&&$('#askI').focus(),50);break;
 case'askq':ask(v);break;
 }
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const k=el.dataset.change,v=el.value;
 if(k==='area'){S.area=v||null;S.hist=null;S.anim=true;renderAll()}
 else if(k==='hist'){S.hist=v;renderView()}
 else if(k==='commodity'){S.commodity=v;renderView()}
 else if(k==='trend'){S.trend=v;renderView()}
 else if(k==='ldept'){S.list.dept=v;S.list.page=0;refreshModal()}
 else if(k==='lsev'){S.list.sev=v;S.list.page=0;refreshModal()}
 else if(k==='lstatus'){S.list.status=v;S.list.page=0;refreshModal()}
 else if(k==='lscope'){S.list.scope=v;S.list.page=0;refreshModal()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){sIdx=0;renderSearch()}else if(e.target.id==='lq'){S.list.q=e.target.value;S.list.page=0;refreshModal()}});
document.addEventListener('keydown',e=>{
 if(e.target.id==='q'){const btns=[...document.querySelectorAll('#sres button')];if(e.key==='ArrowDown'){sIdx=Math.min(btns.length-1,sIdx+1);renderSearch();e.preventDefault()}else if(e.key==='ArrowUp'){sIdx=Math.max(0,sIdx-1);renderSearch();e.preventDefault()}else if(e.key==='Enter'&&btns[sIdx]){btns[sIdx].click()}else if(e.key==='Escape'){e.target.value='';renderSearch()}return}
 if(e.key==='Escape'){if(S.drawer||S.modal)closeAll();else if(S.ask){S.ask=false;renderAsk()}hideMenu();document.body.classList.remove('nav-open')}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='askF'){const v=$('#askI').value.trim();if(v)ask(v)}else if(e.target.id==='actF'){const v=$('#actI').value.trim();if(!v)return;const i=INC.find(x=>x.id===e.target.dataset.v);i.actions.splice(i.actions.length-1,0,{a:v,owner:i.officer,due:Date.now()+24*H,st:'Not Started'});toast('Action added.');renderView()}});
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const r=e.target.closest&&e.target.closest('[data-tip],[data-tipi]');if(!r){tip.hidden=true;return}
 let h;if(r.dataset.tip){const g=REG[r.dataset.tip];const l=S.view==='overview'?scope({area:g.id}):scope({area:g.id,dept:S.view});h=`<b>${g.name}</b>${l.filter(open).length} open · ${l.filter(i=>i.severity==='Severe').length} severe · ${sum(l.filter(open),i=>i.complaints)} complaints<br><span style="opacity:.7">Click to ${S.area===g.id?'keep':'filter to'} this area</span>`}
 else{const i=INC.find(x=>x.id===r.dataset.tipi);h=`<b>${esc(fullTitle(i))}</b>${i.severity} · ${i.status} · ${rel(i.t)}`}
 tip.innerHTML=h;tip.hidden=false;const vw=innerWidth/Z;tip.style.left=Math.min(e.clientX/Z+14,vw-250)+'px';tip.style.top=(e.clientY/Z+14)+'px'});
function route(){const h=location.hash.replace('#','');const v=h.startsWith('dept-')&&DEP[h.slice(5)]?h.slice(5):'overview';if(v!==S.view)S.anim=true;S.view=v;if(S.selNext){S.sel=S.selNext;S.selNext=null}renderAll()}
window.addEventListener('hashchange',route);

/* ---------- live feed ---------- */
function busy(){return S.drawer||S.modal||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))}
setInterval(()=>{NOW=Date.now();const i=mkIncident({t:NOW-60e3,stage:0,verified:false});INC.unshift(i);if(i.severity==='Severe'||i.severity==='High')S.bellRead=false;S.fresh=i.id;
 toast(`New ${i.severity.toLowerCase()} incident: ${esc(i.type)} · ${REG[i.region].name}`,'alert',i.id);
 if(busy())S.dirty=true;else renderAll()},40000);
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('en-US',{hour12:true})},1000);
setInterval(()=>{const u=$('#upd');if(u&&!busy()){NOW=Date.now();u.textContent=fmtTime(NOW)}},30000);

fit();route();window.addEventListener('load',()=>{fit()});setTimeout(fit,400);
</script>
</body></html>
